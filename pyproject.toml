[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "overlay-social"
version = "0.1.0"
description = "Read-only Python client for overlay.peck.to — identity resolution, profiles, feed and overlay state over the canonical BSV/BRC-100 social overlay."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Open BSV License v5" }
authors = [{ name = "Thomas Høiby" }]
keywords = ["bsv", "overlay", "brc-100", "identity", "peck", "social", "metanet"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://overlay.social"
Source = "https://github.com/overlay-social/sdk-python"
Issues = "https://github.com/overlay-social/sdk-python/issues"
Overlay = "https://overlay.peck.to/state"

[tool.hatch.build.targets.wheel]
packages = ["overlay_social"]

[tool.hatch.build.targets.sdist]
include = ["overlay_social", "README.md", "LICENSE"]
